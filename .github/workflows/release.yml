name: Release

# Every version tag (v1.2.3) is a release, and every release is signed:
#   1. the public APK is built and signed, and its signature is checked
#      against KTL's release key (android/release-cert.sha256) — an
#      unsigned APK, or one signed with any other key, stops the release;
#   2. only then is the server image published (image.yml);
#   3. the APK and its SHA-256 go on a draft GitHub release, for the
#      maintainer to look over and publish.
#
# Needs four repository secrets (README → Releasing):
#   KTL_KEYSTORE_BASE64   the release key (.jks), base64-encoded
#   KTL_KEYSTORE_PASSWORD
#   KTL_KEY_ALIAS
#   KTL_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($want). Run npm version first."
            exit 1
          fi

      - name: Release key
        env:
          KTL_KEYSTORE_BASE64: ${{ secrets.KTL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KTL_KEYSTORE_BASE64" ]; then
            echo "::error::The release-key secrets aren't set — see README → Releasing."
            exit 1
          fi
          echo "$KTL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ktl-release-key.jks"

      - name: Build the public APK
        env:
          KTL_KEYSTORE_FILE: ${{ runner.temp }}/ktl-release-key.jks
          KTL_KEYSTORE_PASSWORD: ${{ secrets.KTL_KEYSTORE_PASSWORD }}
          KTL_KEY_ALIAS: ${{ secrets.KTL_KEY_ALIAS }}
          KTL_KEY_PASSWORD: ${{ secrets.KTL_KEY_PASSWORD }}
        run: npm run android:apk

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.apk release/*.apk.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.apk release/*.apk.sha256 \
              --draft --title "KTL $GITHUB_REF_NAME" --generate-notes
          fi

      - name: Keep the APK with the run
        uses: actions/upload-artifact@v4
        with:
          name: ktl-apk
          path: release/

  image:
    name: Server image
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
