name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: App and server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-release.mjs --bundle
      - run: node scripts/build-docs.mjs --check

      - name: Server (gateway) tests
        working-directory: selfhost/gateway
        run: |
          npm ci
          npm test

  server-image:
    name: Server image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker build -f selfhost/Dockerfile -t ktl:latest .
      # Boots it, sets it up through the /setup API and adds a second
      # person, exactly as the end-to-end tests do.
      - run: node scripts/e2e-server.mjs
      - name: Database test suite
        run: docker exec -u postgres ktl-e2e psql -v ON_ERROR_STOP=1 -f /app/db/tests/negative_flows.sql
      - name: Server log
        if: always()
        run: docker logs ktl-e2e

  e2e-tests:
    name: End-to-end tests (Appium, ${{ matrix.device }})
    runs-on: ubuntu-latest
    # The app switches to a split-view layout on tablets, so the same suite
    # runs against both a phone and a landscape tablet. fail-fast is off so
    # one layout breaking still reports how the other one did.
    strategy:
      fail-fast: false
      matrix:
        device: [pixel_6, pixel_tablet]
    steps:
      - uses: actions/checkout@v4

      # The emulator needs more disk than ubuntu-latest leaves free once
      # npm, Gradle and Docker have run. These are large pre-installed
      # toolchains this project never touches.
      - name: Free up disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # GitHub-hosted runners support nested virtualization, but /dev/kvm
      # isn't group-writable by default; without hardware acceleration the
      # emulator boots too slowly to be usable.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Start a throwaway KTL server
        run: |
          docker build -f selfhost/Dockerfile -t ktl:latest .
          node scripts/e2e-server.mjs

      - run: npm ci

      # No server address baked in: the tests go through the Connect
      # screen like a fresh install would.
      - run: npm run build
      - run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Run Appium/WebdriverIO against a booted emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: npm run test:e2e

      - name: Upload Appium/WebdriverIO logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.device }}
          path: e2e/logs/
          retention-days: 7
