# docker compose -f selfhost/docker-compose.yml up -d
# Then open http://<server>:8095/setup — the setup code is in `docker logs ktl`.
# To update: docker compose -f selfhost/docker-compose.yml pull && docker compose -f selfhost/docker-compose.yml up -d
services:
  ktl:
    image: ghcr.io/jpjoseph12/ktl:latest
    # To build from this checkout instead, uncomment these and add --build:
    # build:
    #   context: ..
    #   dockerfile: selfhost/Dockerfile
    container_name: ktl
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8095:3000"
    volumes:
      - ./data:/data
    environment:
      TZ: Europe/London
      # Everything else (address, people, sign-ups, email, push, tunnel,
      # backups) is set on the setup and admin pages. Setting one here
      # locks it:
      # KTL_SITE_URL: https://ktl.example.com
      # CLOUDFLARE_TUNNEL_TOKEN: ...
