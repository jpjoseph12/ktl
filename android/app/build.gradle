import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

/* One version, set in package.json. `npm version patch|minor|major` bumps
   it, and every Play upload needs a higher versionCode than the last:
   1.2.3 → 10203 (minor and patch stay below 100). */
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }
def appVersionCode = vMajor * 10000 + vMinor * 100 + vPatch

/* The release key lives outside git, in one of two places:
     - android/keystore.properties (see keystore.properties.example), for
       builds on your own computer;
     - KTL_KEYSTORE_FILE, KTL_KEYSTORE_PASSWORD, KTL_KEY_ALIAS and
       KTL_KEY_PASSWORD in the environment, for the GitHub release workflow.
   A release build without either stops, rather than quietly producing an
   unsigned APK. */
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def envKeystore = System.getenv('KTL_KEYSTORE_FILE')
def hasReleaseKey = keystorePropertiesFile.exists() || (envKeystore != null && !envKeystore.isEmpty())

/* Push: a build with android/app/google-services.json (a Firebase
   project's app config — not a secret; the release workflow writes it from
   the GOOGLE_SERVICES_JSON secret) can receive push from servers that hold
   that project's service-account key. Without the file, no push. */

android {
    namespace = "com.ktl.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ktl.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else if (hasReleaseKey) {
                storeFile file(envKeystore)
                storePassword System.getenv('KTL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KTL_KEY_ALIAS')
                keyPassword System.getenv('KTL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { (it.name.startsWith('assemble') || it.name.startsWith('bundle')) && it.name.endsWith('Release') }
    if (releasing && !hasReleaseKey) {
        throw new GradleException('No release key: add android/keystore.properties or the KTL_KEYSTORE_* environment variables. Refusing to build an unsigned release.')
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        logger.lifecycle('google-services.json found: this build can receive push.')
    }
} catch(Exception e) {
    logger.lifecycle("No google-services.json: this build has no push.")
}
